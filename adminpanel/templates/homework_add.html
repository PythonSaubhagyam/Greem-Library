{% extends layout_path %}
{% load static %}
{% block title %}Add Homework{% endblock %}

{% block content %}
<div class="container-xxl flex-grow-1 container-p-y">
  <div class="card mb-4">
    <div class="card-body d-flex justify-content-between align-items-center">
      <h4 class="mb-0">Add Homework</h4>
      <div>
        <a href="/administrator/homework/" class="btn btn-sm btn-outline-secondary">Back</a>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <div id="formAlertContainer"></div>
      <form id="homeworkForm">
         {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Title <span class="text-danger">*</span></label>
          <input type="text" id="title" class="form-control" required />
          <div class="invalid-feedback" id="title-error"></div>
        </div>
        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea id="description" class="form-control" rows="4"></textarea>
          <div class="invalid-feedback" id="description-error"></div>
        </div>
        <div class="mb-3">
          <label class="form-label">Due date</label>
          <input type="date" id="due_date" class="form-control" />
          <div class="invalid-feedback" id="due_date-error"></div>
        </div>
        <div class="mb-3">
          <button type="submit" id="saveBtn" class="btn btn-primary">Create Homework</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block page_js %}
<script>
function getCookie(name) {
    let cookieValue = null;

    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');

        for (let cookie of cookies) {
            cookie = cookie.trim();

            if (cookie.startsWith(name + '=')) {
                cookieValue = decodeURIComponent(
                    cookie.substring(name.length + 1)
                );
                break;
            }
        }
    }

    return cookieValue;
}

const csrftoken = getCookie('csrftoken') || (document.querySelector('[name=csrfmiddlewaretoken]') ? document.querySelector('[name=csrfmiddlewaretoken]').value : '');

function showFormError(msg) {
  const alertBox = `
    <div class="alert alert-danger alert-dismissible fade show d-flex align-items-center mb-4" role="alert">
      <i class="bx bx-error-circle me-2 fs-4"></i>
      <div class="flex-grow-1">${msg}</div>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
  `;
  document.getElementById('formAlertContainer').innerHTML = alertBox;
}

document.getElementById('homeworkForm').addEventListener('submit', function(e){
  e.preventDefault();
  document.getElementById('formAlertContainer').innerHTML = '';
  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;

  const payload = {
    title: document.getElementById('title').value,
    description: document.getElementById('description').value,
    due_date: document.getElementById('due_date').value || null
  };

  fetch('/administrator/homework/', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-CSRFToken': csrftoken
    },
    credentials: 'same-origin',
    body: JSON.stringify(payload)
  }).then(r=>r.json()).then(res=>{
       saveBtn.disabled = false;
       if(res.data){
         const params = new URLSearchParams(window.location.search);
         const next = params.get('next');
         if (next) {
           window.location.href = next;
           return;
         }
         const isCustomer = window.location.pathname.includes('/customer/dashboard');
         window.location.href = isCustomer ? '/customer/dashboard/homework/' : '/administrator/homework/';
    } else if(res.errors){
      let errMsg = typeof res.errors === 'object' ? Object.values(res.errors).flat().join(', ') : res.errors;
      showFormError(errMsg || 'Failed to create homework. Please check your entries.');
    } else {
      showFormError('Unexpected response from server.');
    }
  }).catch(err=>{
    saveBtn.disabled = false;
    showFormError('Network connection error.');
    console.error(err);
  });
});
</script>
{% endblock %}
